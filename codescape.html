<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code scape | EGG carton</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/codescape.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="./index.html">[EGG carton]</a>
      <nav aria-label="Pages">
        <ul>
          <li class="home"><a href="./index.html">Home</a></li>
          <li class="about"><a href="./about.html">About</a></li>
          <li class="code"><a href="./codescape.html" aria-current="page">Code scape</a></li>
          <li class="gallery"><a href="./gallery.html">Gallery</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <h2>Code scape</h2>
        <p>Small HTML, CSS and JavaScript projects. Pick one and try it right here.</p>
      </section>

      <!-- filled by js/codescape.js with projects that have a  play  link -->
      <div class="card-grid" id="code-grid"></div>
    </main>

    <!-- the player: shows a code project inside the page -->
    <div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="player-bar">
        <h2 id="player-title"></h2>
        <a class="btn" id="player-open" target="_blank">Open in new tab</a>
        <button class="btn" id="player-close" type="button">Close</button>
      </div>
      <iframe id="player-frame" title="Code project"></iframe>
    </div>

    <footer>
      <span>&copy; 2026 EGG carton &middot; Interaction design portfolio</span>
      <a href="mailto:geldeneg@gmail.com">Email</a>
    </footer>
    <script src="content/projects.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/codescape.js"></script>
  </body>
</html>
